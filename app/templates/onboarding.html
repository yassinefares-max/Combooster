<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration de Votre Stratégie Marketing</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .onboarding-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .onboarding-header {
            background: var(--primary);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .onboarding-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .onboarding-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .onboarding-content {
            padding: 40px 30px;
            text-align: center;
        }
        
        .onboarding-content h2 {
            color: var(--dark);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .onboarding-content p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn-start {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-start:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .steps-indicator {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 10px;
        }
        
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            transition: background 0.3s ease;
        }
        
        .step-dot.active {
            background: var(--primary);
        }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="onboarding-header">
            <h1>🚀 Bienvenue</h1>
            <p>Configurez votre stratégie marketing en 4 étapes simples</p>
        </div>
        
        <div class="onboarding-content">
            <h2>Prêt à booster votre présence digitale ?</h2>
            <p>
                Notre système va analyser votre site web, comprendre votre identité 
                et générer une stratégie de contenu personnalisée pour vos réseaux sociaux.
            </p>
            
            <a href="{{ url_for('onboarding_sector') }}" class="btn-start">
                Commencer la Configuration
            </a>
            
            <div class="steps-indicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
            </div>
        </div>
    </div>
</body>
</html>
