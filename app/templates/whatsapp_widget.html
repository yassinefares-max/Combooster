<!DOCTYPE html>
<html>
<head>
    <style>
        .whatsapp-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 9999;
        }
        
        .whatsapp-chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .whatsapp-chat-window.active {
            display: flex;
        }
        
        .whatsapp-chat-header {
            background: linear-gradient(135deg, #25D366, #20BA58);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .whatsapp-chat-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }
        
        .whatsapp-chat-header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .whatsapp-close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .whatsapp-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .whatsapp-message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .whatsapp-message.user {
            justify-content: flex-end;
        }
        
        .whatsapp-message.bot {
            justify-content: flex-start;
        }
        
        .whatsapp-message-content {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        
        .whatsapp-message.user .whatsapp-message-content {
            background: #25D366;
            color: white;
            border-radius: 18px 4px 18px 18px;
        }
        
        .whatsapp-message.bot .whatsapp-message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 4px 18px 18px 18px;
        }
        
        .whatsapp-input-container {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .whatsapp-input-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f0f0f0;
            border-radius: 24px;
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
        }
        
        .whatsapp-input-box input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 0.95rem;
        }
        
        .whatsapp-send-btn {
            background: #25D366;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .whatsapp-send-btn:hover {
            background: #20BA58;
        }
        
        .whatsapp-send-btn:disabled {
            background: #ccc;
        }
        
        .whatsapp-fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background:transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
        }

        .whatsapp-icon {
            width: 50px;
            height: 50px;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); }
            50% { box-shadow: 0 4px 20px rgba(37, 211, 102, 0.6); }
        }
        
        .whatsapp-fab:hover {
            transform: scale(1.1);
        }
        
        .whatsapp-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3545;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            border: 2px solid white;
        }
        
        .whatsapp-typing {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background: white;
            border-radius: 18px;
            border: 1px solid #e0e0e0;
            width: fit-content;
        }
        
        .whatsapp-typing span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .whatsapp-typing span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .whatsapp-typing span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <!-- 🟢 WIDGET WHATSAPP FLOTTANT -->
    <div class="whatsapp-widget-container">
        <!-- Fenêtre de Chat -->
        <div class="whatsapp-chat-window" id="whatsapp-chat">
            <!-- En-tête -->
            <div class="whatsapp-chat-header">
                <div>
                    <h3>WhatsApp business</h3>
                </div>
                <button class="whatsapp-close-btn" id="whatsapp-close-btn">✕</button>
            </div>
            
            <!-- Messages -->
            <div class="whatsapp-messages" id="whatsapp-messages">
                <div class="whatsapp-message bot">
                    <div class="whatsapp-message-content">
                        Bonjour 👋! Bienvenue chez Marketing AI. Comment pouvons-nous vous aider?
                    </div>
                </div>
            </div>
            
            <!-- Zone de saisie -->
            <div class="whatsapp-input-container">
                <div class="whatsapp-input-box">
                    <input 
                        type="text" 
                        id="whatsapp-input" 
                        placeholder="Message..." 
                        autocomplete="off">
                </div>
                <button class="whatsapp-send-btn" id="whatsapp-send-btn">
                    📤
                </button>
            </div>
        </div>
        
        <!-- Bouton Flottant -->
        <button class="whatsapp-fab" id="whatsapp-fab">
            <img src="{{ url_for('static', filename='images/logowhatsapp.png') }}" 
                alt="icon" class="whatsapp-icon">
            <span class="whatsapp-badge" id="whatsapp-badge" style="display: none;">1</span>
        </button>
    </div>

    <script>
        // ========================================
        // 🟢 WIDGET WHATSAPP - VERSION BACKEND
        // ========================================
        
        class WhatsAppWidgetBackend {
            constructor() {
                this.chatWindow = document.getElementById('whatsapp-chat');
                this.fab = document.getElementById('whatsapp-fab');
                this.closeBtn = document.getElementById('whatsapp-close-btn');
                this.sendBtn = document.getElementById('whatsapp-send-btn');
                this.input = document.getElementById('whatsapp-input');
                this.messagesContainer = document.getElementById('whatsapp-messages');
                this.badge = document.getElementById('whatsapp-badge');
                this.availabilityStatus = document.getElementById('availability-status');
                
                this.isOpen = false;
                this.unreadCount = 0;
                this.isSending = false;
                
                this.init();
            }
            
            init() {
                this.fab.addEventListener('click', () => this.toggleChat());
                this.closeBtn.addEventListener('click', () => this.closeChat());
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                // Charger l'historique
                this.loadHistory();
                
                // Vérifier le statut
                this.updateStatus();
                setInterval(() => this.updateStatus(), 60000);
            }
            
            toggleChat() {
                if (this.isOpen) {
                    this.closeChat();
                } else {
                    this.openChat();
                }
            }
            
            openChat() {
                this.isOpen = true;
                this.chatWindow.classList.add('active');
                this.input.focus();
                this.markAsRead();
            }
            
            closeChat() {
                this.isOpen = false;
                this.chatWindow.classList.remove('active');
            }
            
            sendMessage() {
                const message = this.input.value.trim();
                
                if (!message || this.isSending) return;
                
                this.isSending = true;
                this.sendBtn.disabled = true;
                
                // Ajouter le message utilisateur
                this.addMessage(message, 'user');
                this.input.value = '';
                
                // Afficher l'indicateur de saisie
                this.showTypingIndicator();
                
                // Envoyer au backend
                fetch('/api/whatsapp/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erreur HTTP: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    this.removeTypingIndicator();
                    
                    if (data.success) {
                        // Ajouter la réponse du bot
                        this.addMessage(data.response, 'bot');
                        this.scrollToBottom();
                    } else {
                        this.addMessage('Erreur: ' + (data.error || 'Impossible de traiter le message'), 'bot');
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    this.removeTypingIndicator();
                    this.addMessage('Erreur de connexion. Réessayez plus tard.', 'bot');
                })
                .finally(() => {
                    this.isSending = false;
                    this.sendBtn.disabled = false;
                });
            }
            
            addMessage(text, sender) {
                const messageEl = document.createElement('div');
                messageEl.className = `whatsapp-message ${sender}`;
                
                const time = new Date().toLocaleTimeString('fr-FR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                
                messageEl.innerHTML = `
                    <div class="whatsapp-message-content">${this.escapeHtml(text)}</div>
                `;
                
                this.messagesContainer.appendChild(messageEl);
                this.scrollToBottom();
            }
            
            showTypingIndicator() {
                const typingEl = document.createElement('div');
                typingEl.className = 'whatsapp-message bot';
                typingEl.id = 'typing-indicator';
                typingEl.innerHTML = `
                    <div class="whatsapp-typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;
                
                this.messagesContainer.appendChild(typingEl);
                this.scrollToBottom();
            }
            
            removeTypingIndicator() {
                const typingEl = document.getElementById('typing-indicator');
                if (typingEl) typingEl.remove();
            }
            
            scrollToBottom() {
                setTimeout(() => {
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                }, 10);
            }
            
            loadHistory() {
                fetch('/api/whatsapp/history?limit=20')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success && data.messages.length > 1) {
                            // Effacer le message initial
                            this.messagesContainer.innerHTML = '';
                            
                            // Charger l'historique
                            data.messages.forEach(msg => {
                                this.addMessage(msg.message, msg.direction);
                            });
                        }
                    })
                    .catch(error => console.error('Erreur chargement historique:', error));
            }
            
            markAsRead() {
                fetch('/api/whatsapp/mark-read', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(() => {
                    this.unreadCount = 0;
                    this.updateBadge();
                })
                .catch(error => console.error('Erreur:', error));
            }
            
            updateStatus() {
                fetch('/api/whatsapp/status')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Mettre à jour le statut de disponibilité
                            if (data.is_available) {
                                this.availabilityStatus.textContent = '🟢 Généralement actif maintenant';
                            } else {
                                this.availabilityStatus.textContent = '🔴 Hors des heures de bureau';
                            }
                            
                            // Mettre à jour le badge
                            this.unreadCount = data.unread_count;
                            this.updateBadge();
                        }
                    })
                    .catch(error => console.error('Erreur:', error));
            }
            
            updateBadge() {
                if (this.unreadCount > 0) {
                    this.badge.textContent = this.unreadCount;
                    this.badge.style.display = 'flex';
                } else {
                    this.badge.style.display = 'none';
                }
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
        
        // Initialiser le widget au chargement
        document.addEventListener('DOMContentLoaded', () => {
            window.whatsappWidget = new WhatsAppWidgetBackend();
        });
    </script>
</body>
</html>
