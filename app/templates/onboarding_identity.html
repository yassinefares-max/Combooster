<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étape 4: Identité Visuelle</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .onboarding-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .onboarding-header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .onboarding-header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .onboarding-header p {
            opacity: 0.9;
        }
        
        .onboarding-content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: var(--dark);
        }
        
        .file-upload {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border 0.3s ease;
        }
        
        .file-upload:hover {
            border-color: var(--primary);
        }
        
        .file-upload input {
            display: none;
        }
        
        .upload-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #666;
        }
        
        .upload-text {
            color: #666;
        }
        
        .color-picker {
            display: flex;
            gap: 15px;
        }
        
        .color-input {
            flex: 1;
        }
        
        .color-input input {
            width: 100%;
            height: 50px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .color-label {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--secondary);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: var(--dark);
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
        }
        
        .progress-bar {
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="onboarding-header">
            <h1>🎨 Étape 4: Identité Visuelle</h1>
            <p>Personnalisez votre charte graphique</p>
        </div>
        
        <div class="onboarding-content">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Votre logo</label>
                    <div class="file-upload" onclick="document.getElementById('logo').click()">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">
                            Cliquez pour télécharger votre logo<br>
                            <small>PNG, JPG - Max 5MB</small>
                        </div>
                        <input type="file" id="logo" name="logo" accept="image/*">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Vos couleurs principales</label>
                    <div class="color-picker">
                        <div class="color-input">
                            <input type="color" id="primary_color" name="primary_color" value="#4361ee">
                            <div class="color-label">Couleur principale</div>
                        </div>
                        <div class="color-input">
                            <input type="color" id="secondary_color" name="secondary_color" value="#3a0ca3">
                            <div class="color-label">Couleur secondaire</div>
                        </div>
                    </div>
                </div>
                
                <p style="color: #666; font-size: 0.9rem; text-align: center; margin: 20px 0;">
                    Ces éléments seront utilisés pour personnaliser vos visuels 
                    et maintenir la cohérence de votre marque.
                </p>
                
                <div class="btn-container">
                    <a href="{{ url_for('onboarding_sources') }}" class="btn btn-secondary">
                        Retour
                    </a>
                    <button type="submit" class="btn btn-primary">
                        Terminer la Configuration
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.getElementById('logo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const uploadText = document.querySelector('.upload-text');
                uploadText.innerHTML = `✅ ${file.name}<br><small>Prêt à être uploadé</small>`;
            }
        });
    </script>
</body>
</html>
